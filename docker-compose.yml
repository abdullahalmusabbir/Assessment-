version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: school-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: schooldb
    ports:
      - "5432:5432"
    volumes:
      - school_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d schooldb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Database=schooldb;Username=postgres;Password=postgres123
      - Frontend__BaseUrl=http://localhost:3000
      - Jwt__Issuer=SchoolAdmissionSystem
      - Jwt__Audience=SchoolAdmissionFrontend
      - Jwt__SecretKey=your-32-byte-or-longer-secret-key-here!
      - Jwt__AccessTokenExpiryMinutes=15
      - Jwt__RefreshTokenExpiryDays=7
      - Admission__HoldDurationSeconds=600
      - Google__ClientId=
      - Google__ClientSecret=
      - Email__Host=smtp.gmail.com
      - Email__Port=587
      - Email__Username=
      - Email__Password=
      - Email__FromEmail=
      - Email__FromName=School Admission System
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: school-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
    ports:
      - "3000:3000"

volumes:
  school_db_data: